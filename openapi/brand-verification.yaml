  title: TrustLedger Brand Verification API
  version: 1.0.0
  summary: The contract a brand implements so its products can be verified before payment.
  description: 'TrustLedger makes product authenticity a condition of payment. At checkout, the platform asks the
    brand whether a serialized product may be sold at this store. Only a VERIFIED answer leads to a PayPal order,
    and the verification_id travels in the order''s custom_id. After capture, the platform confirms the sale so
    the brand can mark the serial sold.


    Brands implement these two endpoints. The reference implementation is TrustLedger''s mock brand (Nimbus, fictional).
    Responses must not reveal which store a serial belongs to.'
