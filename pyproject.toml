[project]
name = "trustledger"
version = "0.1.0"
description = "Product authenticity as a condition of PayPal payment"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "opendp>=0.12",
  "openai>=1.50",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "paypal-server-sdk==2.4.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
