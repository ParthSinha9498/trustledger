# Render Blueprint for TrustLedger, free plan. Spec: https://render.com/docs/blueprint-spec
# Setup steps (what to click, what to paste): docs/DEPLOY.md
#
# The free plan only offers web services (plus one Postgres that expires after 30 days), so:
#   trustledger-web       web (free)  Next.js (docker/web.Dockerfile), public
#   trustledger-backend   web (free)  one container, four processes (docker/all_in_one.sh):
#                                       api          public on $PORT    platform DB only
#                                       brand-node   127.0.0.1:8001     brand DB only
#                                       paypal-node  127.0.0.1:8002     PayPal-side DB only
#                                       worker       investigation agent, no DB at all
#                                     The data nodes are never reachable from the internet. It seeds
#                                     the databases on first start (SEED_ON_START=auto: only when empty).
#
# Databases: three Postgres databases (brand, paypal_side, platform), created outside this file and
# pasted in as URLs, because a free Render Postgres expires 30 days after creation (judging is
# Dec 1-15). See docs/DEPLOY.md for the options.
#
# Free web services sleep after 15 minutes without traffic; the first request then takes ~1 minute.

services:
  # ------------------------------------------------------------------ web (Next.js)
  - type: web
    name: trustledger-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./docker/web.Dockerfile
    dockerContext: .
    healthCheckPath: /
    buildFilter:
      paths: [web/**, docker/web.Dockerfile]
    envVars:
      # Render passes service env vars to the Docker build as build args. web.Dockerfile turns
      # API_PUBLIC_HOST into NEXT_PUBLIC_API_URL=https://<host> (public values only).
      - key: API_PUBLIC_HOST
        fromService: { type: web, name: trustledger-backend, envVarKey: RENDER_EXTERNAL_HOSTNAME }
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false

  # ------------------------------------------------------------------ backend (api + nodes + worker)
  - type: web
    name: trustledger-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    dockerCommand: /app/docker/start.sh all-in-one
    healthCheckPath: /health
    buildFilter:
      paths: [backend/**, docker/backend.Dockerfile, docker/start.sh, docker/all_in_one.sh, docker/seed.py,
              pyproject.toml, uv.lock]
    envVars:
      # One URL per logical database; all_in_one.sh hands each process only its own.
      - key: BRAND_DATABASE_URL
        sync: false
      - key: PAYPAL_DATABASE_URL
        sync: false
      - key: PLATFORM_DATABASE_URL
        sync: false
      - key: SEED_ON_START       # auto (seed only when empty) | always (reset the demo) | never
        value: auto
      - key: WEB_PUBLIC_HOST     # start.sh derives CORS_ORIGINS and PUBLIC_WEB_URL from it
        fromService: { type: web, name: trustledger-web, envVarKey: RENDER_EXTERNAL_HOSTNAME }
      - key: NODE_SHARED_TOKEN   # still required between processes, even on localhost
        generateValue: true
      - key: PAYER_HASH_KEY      # secret for the keyed hash of payer IDs; only the PayPal-side process gets it
        generateValue: true
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID   # fill in after creating the webhook for https://<backend-host>/paypal/webhooks
        sync: false
      - key: LLM_MODE
        value: live
      - key: LLM_API_KEY         # agent + console planner
        sync: false
      - key: LLM_BASE_URL        # any OpenAI-compatible provider; Groq's free tier is the default
        value: https://api.groq.com/openai/v1
      - key: AGENT_MODEL
        value: openai/gpt-oss-120b
      - key: NOTIFY_WEBHOOK_URL  # optional Zapier / Slack hook; leave blank to disable alerts
        sync: false
      - key: BRAND_ID
        value: nimbus
      - key: CURRENT_WEEK
        value: "42"
      - key: DAILY_EPSILON
        value: "5.0"
