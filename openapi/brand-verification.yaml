      description: 'Called by the checkout platform when a cashier scans a serialized product, **before** any PayPal
        order exists. Return VERIFIED only if the brand stands behind this unit being sold at this store. How the
        brand decides is its own business logic. Every call should be logged by the brand.


        Always answer 200 with a verdict for well-formed requests, including unknown serials; use reason_code to
